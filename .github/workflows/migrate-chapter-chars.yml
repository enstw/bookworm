# 一次性補寫:把每章字數(books.chapter_chars)填進既有的索引列。
# 書櫃 /api/books 自 2026-08-16 起從索引列讀這個欄位;在那之前上架的書
# 該欄還是 '',progress 靠讀 R2 manifest 的 fallback 撐著。這裡對正式站
# 跑完整一輪 /api/admin/reindex(registerBook 的 upsert 順路補寫),再用
# 只讀查詢確認沒有留下空欄。只有一個 instance,不必留相容層:migrate
# 跑完、app 的 fallback 移除之後,這個檔案一併刪掉。
#
# 手動觸發(Actions → migrate chapter chars → Run workflow)。跑在這裡是
# 因為 ADMIN_TOKEN 只存在 repo secrets——本機沒有正式站的密鑰,也不需要有。
# 公開 repo 的記錄任何人都看得到,所以只印計數,不印書名也不印代稱。
name: migrate chapter chars

on:
  workflow_dispatch:

# 跟上架/整理搶同一個 R2 寫入配額 → 排同一條隊
concurrency:
  group: publish-book
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # wrangler(驗證步驟用)是 devDependency,所以要裝一次
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: reindex(補寫索引列)
        env:
          # 走環境變數而不是命令列:命令列會出現在記錄裡,環境變數不會
          BOOKWORM_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SERVER: ${{ secrets.BOOKWORM_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER:-}" ] || [ -z "${BOOKWORM_ADMIN_TOKEN:-}" ]; then
            echo "::error::少了 BOOKWORM_URL 或 ADMIN_TOKEN secret"
            exit 1
          fi
          # 跟 /admin 的 runReindex 同一個合約:把 cursor/runAt/indexed/notes
          # 原樣遞回去,直到 done。第一輪送 null 值,伺服器端各有預設。
          STATE='{}'
          for _ in $(seq 1 500); do
            STATE=$(curl -fsS -X POST "$SERVER/api/admin/reindex" \
              -H "authorization: Bearer $BOOKWORM_ADMIN_TOKEN" \
              -H "content-type: application/json" \
              --data "$(jq -c '{cursor, runAt, indexed, notes}' <<<"$STATE")")
            if [ "$(jq -r '.done' <<<"$STATE")" = "true" ]; then
              # notes 內容帶書的代稱 → 只印它有幾條
              jq '{indexed, pruned, notes: (.notes | length)}' <<<"$STATE" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::跑了 500 輪還沒 done——中止"
          exit 1

      - name: 驗證(只讀)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          set -euo pipefail
          ROW=$(pnpm exec wrangler d1 execute bookworm --remote --json --command \
            "SELECT COUNT(*) AS books, COALESCE(SUM(chapter_chars = ''), 0) AS missing FROM books" \
            | jq '.[0].results[0]')
          tee -a "$GITHUB_STEP_SUMMARY" <<<"$ROW"
          if [ "$(jq -r '.missing' <<<"$ROW")" != "0" ]; then
            echo "::error::還有書的 chapter_chars 是空的——fallback 還不能移除"
            exit 1
          fi
