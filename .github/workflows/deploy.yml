# Push-to-deploy, gated on the desktop test suite: every push to main first
# runs the pnpm-test chain (scripts/run-ci-tests.mjs — per-suite logs and a
# report); only a green run reaches scripts/deploy.sh with credentials from
# repo secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN) —
# no machine needs a local .deploy.env.
#
# A red run publishes a test-failure-* pre-release whose notes name the
# failing suite and embed its log tail, then skips the deploy. The e2e
# ADMIN_TOKEN/VAPID pair are generated per run — the dev server under test is
# local to the runner, so nothing secret is involved in testing.
#
# Permissions are per job, never workflow-wide: the test job executes the
# pushed code, so it runs with a read-only token and a credential-free
# checkout — a compromised dependency inside the suite has nothing to write
# with. Only the two jobs that never execute repository code from the tested
# commit hold contents: write — failure-report (publishes the pre-release
# from the uploaded artifact alone) and deploy (runs only after a green
# gate). scripts/test-deploy-policy.mjs asserts this split stays true.
name: deploy

on:
  push:
    branches: [main]
    # renovate's own config cannot change a byte the worker serves, and a
    # roll-up that edits it still touches package.json and deploys normally
    paths-ignore: ["**.md", ".github/renovate.json5"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ADMIN_TOKEN: bookworm-ci-${{ github.run_id }}
      BROWSER_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # the suite runs the pushed code; leave no token on disk for it
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg for the tts-stream fixture
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Scaffold .dev.vars and the local D1 schema
        run: |
          {
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf "VAPID_PRIVATE_JWK='%s'\n" "$(node scripts/gen-vapid.mjs | head -1 | cut -d= -f2-)"
            printf 'VAPID_SUBJECT=mailto:ci@bookworm.invalid\n'
          } > .dev.vars
          pnpm run db:init:local
      - name: Run the test gate
        run: node scripts/run-ci-tests.mjs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-gate-report
          path: test-artifacts/

  # Publishes the red-run record WITHOUT checking out or executing any code
  # from the failed commit: everything it touches comes from the artifact the
  # test job uploaded, validated against fixed names and a size cap before a
  # byte of it becomes a public release asset.
  failure-report:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: test-gate-report
          path: test-artifacts
      - name: Publish failed-tests record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd test-artifacts
          # fixed names only, and nothing bigger than a log tail has business
          # being here — refuse the whole upload rather than publish a stray
          for f in report.json report.md; do
            [ -f "$f" ] || { echo "missing $f in artifact" >&2; exit 1; }
          done
          while IFS= read -r f; do
            case "$f" in
              ./report.json|./report.md|./logs/*.log) ;;
              *) echo "unexpected file in artifact: $f" >&2; exit 1 ;;
            esac
          done < <(find . -type f)
          TOTAL_KB=$(du -sk . | cut -f1)
          if [ "$TOTAL_KB" -gt 102400 ]; then
            echo "artifact is ${TOTAL_KB} KB, over the 100 MB cap" >&2
            exit 1
          fi
          gh release create "test-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            report.json \
            logs/*.log \
            --target "$GITHUB_SHA" \
            --title "Failed tests — ${GITHUB_SHA::12}" \
            --notes-file report.md \
            --prerelease \
            -R "$GITHUB_REPOSITORY"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      # the release ledger goes to main through a PR gated on candidate-gate
      # (H-03), so this job opens the PR and dispatches the gate
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # update-releases.mjs walks released..HEAD; a shallow clone has
          # neither the tag nor the history behind it
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # re-cut the assets release if the wasmtts pin moved ort — before the
      # worker that asks for the new filename goes live
      - run: node scripts/sync-wasmtts-assets.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      # before deploy.sh, not with the ledger step below: this file is UPLOADED
      # by the deploy, so it has to exist first — while RELEASES.md must not be
      # written until the deploy is known green. Same computation either way.
      - run: node scripts/gen-release-notes.mjs
      - run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # Ledger the release: prepend what shipped to RELEASES.md, then move the
      # `released` tag onto the deployed commit — commits that land mid-deploy
      # stay inside the next range; the script filters the ledger's own docs
      # commits out of entries. The ledger reaches main through a PR (H-03:
      # main requires a PR with a green candidate-gate, no direct pushes, no
      # bypass actors — automation included). The merge cannot loop: an
      # md-only commit is paths-ignored above, and a GITHUB_TOKEN merge never
      # triggers `on: push` anyway — the same recursion guard renovate.yml
      # leans on. If main moves while the gate runs, the merge fails and the
      # tag stays put; the next deploy's ledger then covers both ranges.
      - name: Record the release in RELEASES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/update-releases.mjs
          git add RELEASES.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record release ${GITHUB_SHA::12}"
          # --autostash: the deploy leaves build products behind (releases.json,
          # public/vendor/), and if one of them is ever tracked by mistake this
          # rebase dies with "cannot pull with rebase: You have unstaged
          # changes" AFTER the deploy has already shipped — the ledger and the
          # tag are then silently a release behind. Stashing costs nothing and
          # turns that class of mistake back into a no-op. Rebasing onto the
          # latest main also keeps the strict required check happy: the PR is
          # born up to date.
          git pull --rebase --autostash origin main
          BRANCH="automation/release-ledger-${GITHUB_RUN_ID}"
          HEAD_SHA=$(git rev-parse HEAD)
          git push origin "HEAD:${BRANCH}"
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "docs: record release ${GITHUB_SHA::12}" \
            --body "Automated release ledger for deploy run ${GITHUB_RUN_ID}; merged by the deploy workflow once candidate-gate is green."
          # a GITHUB_TOKEN push never fires pull_request — dispatch the gate
          gh workflow run candidate --ref "$BRANCH" -R "$GITHUB_REPOSITORY"
          node scripts/wait-candidate-gate.mjs "$HEAD_SHA"
          gh pr merge "$BRANCH" -R "$GITHUB_REPOSITORY" \
            --rebase --delete-branch --match-head-commit "$HEAD_SHA"
          git tag -f released "$GITHUB_SHA"
          git push -f origin released
