# Upstream monitoring for the npm dependencies, including the two bundles
# vendored into public/vendor/ (opencc-js, fflate): Dependabot opens a PR on
# each new release; `pnpm run deploy` re-vendors, so a merged bump reaches the
# served assets on the next deploy. Security advisories additionally trigger
# immediate PRs regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
